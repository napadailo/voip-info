# Каталог продуктов. repo - GitHub owner/name; tag_filter - regex отбора тегов;
# nvd/nvd_filter - поиск CVE в NVD; deps - зависимости "id:тип" (bundled, linked, optional, runtime, platform);
# track: commits - для проектов без релизов; npm/pypi/docker - пакеты для метрик использования;
# desc - описание на языках интерфейса: {en: ..., ru: ...}, строка без языков считается английской.
products:
- id: asterisk
  tag_filter: '^\d'
  deps:
  - 'pjsip:bundled'
  - 'spandsp:optional'
  - 'opus:optional'
  nvd: Asterisk
  nvd_filter: '(?i)asterisk (open source|is an open|before|through|certified|\d)|digium|sangoma|res_pjsip|chan_'
  name: Asterisk
  category: PBX
  repo: asterisk/asterisk
  homepage: 'https://www.asterisk.org'
  desc:
    en: "Classic open-source PBX and telephony platform by Sangoma (PJSIP, ARI, AMI)."
    ru: "Классическая open-source PBX/телефонная платформа от Sangoma (PJSIP, ARI, AMI)."
- id: freeswitch
  deps:
  - 'sofia-sip:linked'
  - 'spandsp:linked'
  - 'opus:linked'
  nvd: FreeSWITCH
  name: FreeSWITCH
  category: PBX
  repo: signalwire/freeswitch
  homepage: 'https://signalwire.com/freeswitch'
  desc:
    en: "Modular softswitch and media server by SignalWire: ESL, mod_verto, conferences."
    ru: "Модульный softswitch/медиасервер от SignalWire, ESL, mod_verto, конференции."
- id: fusionpbx
  deps:
  - 'freeswitch:platform'
  nvd: FusionPBX
  name: FusionPBX
  category: PBX
  repo: fusionpbx/fusionpbx
  homepage: 'https://www.fusionpbx.com'
  desc:
    en: "Multi-tenant web PBX on top of FreeSWITCH."
    ru: "Multi-tenant веб-PBX поверх FreeSWITCH."
- id: freepbx
  deps:
  - 'asterisk:platform'
  nvd: FreePBX
  name: FreePBX
  category: PBX
  repo: FreePBX/framework
  homepage: 'https://www.freepbx.org'
  desc:
    en: "Web GUI and distribution on top of Asterisk (Sangoma)."
    ru: "Веб-GUI и дистрибутив поверх Asterisk (Sangoma)."
- id: wazo
  deps:
  - 'asterisk:platform'
  nvd: Wazo
  name: Wazo Platform
  category: PBX
  repo: wazo-platform/wazo-calld
  homepage: 'https://wazo-platform.org'
  desc:
    en: "API-first UC/PBX platform on Asterisk (microservices)."
    ru: "API-first UC/PBX платформа на Asterisk (микросервисы)."
- id: kamailio
