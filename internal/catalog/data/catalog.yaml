  name: Jitsi Meet
  category: WebRTC
  repo: jitsi/jitsi-meet
  tag_filter: ^jitsi-meet_
  homepage: 'https://jitsi.org/jitsi-meet/'
  desc:
    en: "Open-source video conferencing on top of JVB."
    ru: "Open-source ВКС поверх JVB."
- id: mediasoup
  npm:
  - mediasoup
  nvd: mediasoup
  name: mediasoup
  category: WebRTC
  repo: versatica/mediasoup
  tag_filter: '^3\.'
  homepage: 'https://mediasoup.org'
  desc:
    en: "SFU library for Node.js and Rust."
    ru: "SFU-библиотека для Node.js/Rust."
- id: livekit
  npm:
  - livekit-client
  docker:
  - livekit/livekit-server
  deps:
  - 'pion:linked'
  nvd: LiveKit
  name: LiveKit
  category: WebRTC
  repo: livekit/livekit
  homepage: 'https://livekit.io'
