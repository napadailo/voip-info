    ru: "SIP-сервер, управляемый из Node.js (основа jambonz)."
- id: sems
  name: SEMS
  category: SIP Proxy
  repo: sems-server/sems
  homepage: 'https://github.com/sems-server/sems'
  desc:
    en: "SIP Express Media Server: B2BUA, SBC, conferences."
    ru: "SIP Express Media Server: B2BUA, SBC, конференции."
- id: routr
  docker:
  - fonoster/routr-one
  name: Routr
  category: SIP Proxy
  repo: fonoster/routr
  homepage: 'https://routr.io'
  desc:
    en: "Cloud-native SIP proxy, registrar and load balancer for Kubernetes."
    ru: "Cloud-native SIP proxy/registrar/LB для Kubernetes."
- id: flexisip
  deps:
  - 'linphone:linked'
  nvd: Flexisip
  name: Flexisip
  category: SIP Proxy
  repo: BelledonneCommunications/flexisip
  homepage: 'https://www.linphone.org/en/flexisip-sip-server/'
  desc:
    en: "Belledonne SIP server (Linphone): push, presence, conferences."
    ru: "SIP-сервер Belledonne (Linphone): push, presence, конференции."
- id: resiprocate
  nvd: reSIProcate
  name: reSIProcate
  category: SIP Proxy
  repo: resiprocate/resiprocate
  tag_filter: ^resiprocate-
  homepage: 'https://www.resiprocate.org'
  desc:
    en: "C++ SIP stack with the repro proxy and the reTurn TURN server."
    ru: "C++ SIP-стек и repro proxy, reTurn TURN-сервер."
- id: rtpengine
  nvd: rtpengine
  name: rtpengine
  category: Media/RTP
  repo: sipwise/rtpengine
  homepage: 'https://rtpengine.readthedocs.io'
  desc:
    en: "RTP/SRTP proxy with kernel forwarding, transcoding and recording (Sipwise)."
    ru: "RTP/SRTP-прокси с kernel forwarding, транскодингом, записью (Sipwise)."
- id: rtpproxy
  nvd: rtpproxy
  # the rtpproxy modules of OpenSIPS and Kamailio are not the relay
  nvd_exclude: '(?i)(determined|discovered|found|detected|identified) in (opensips|kamailio)|(opensips|kamailio) (up to|through|before)'
  name: RTPProxy
  category: Media/RTP
  repo: sippy/rtpproxy
  homepage: 'https://www.rtpproxy.org'
  desc:
    en: "High-performance RTP relay for NAT traversal."
    ru: "Высокопроизводительный RTP-релей для NAT traversal."
- id: coturn
  docker:
  - coturn/coturn
  nvd: coturn
  name: coturn
  category: Media/RTP
  repo: coturn/coturn
  tag_filter: '^\d'
  homepage: 'https://github.com/coturn/coturn'
  desc:
    en: "The standard open-source TURN/STUN server."
    ru: "Стандартный open-source TURN/STUN-сервер."
- id: eturnal
  name: eturnal
  category: Media/RTP
  repo: processone/eturnal
  homepage: 'https://eturnal.net'
  desc:
    en: "STUN/TURN server in Erlang (ProcessOne)."
    ru: "STUN/TURN-сервер на Erlang (ProcessOne)."
- id: stunner
  name: STUNner
