  - 'rtpengine:runtime'
  - 'rtpproxy:runtime'
  nvd: Kamailio
  name: Kamailio
  category: SIP Proxy
  repo: kamailio/kamailio
  homepage: 'https://www.kamailio.org'
  desc:
    en: "High-load SIP server: proxy, registrar, load balancer, SBC scenarios."
    ru: "Высоконагруженный SIP-сервер: proxy, registrar, LB, SBC-сценарии."
- id: opensips
  docker:
  - opensips/opensips
  deps:
  - 'rtpengine:runtime'
  - 'rtpproxy:runtime'
  nvd: OpenSIPS
  name: OpenSIPS
  category: SIP Proxy
  repo: OpenSIPS/opensips
  homepage: 'https://opensips.org'
  desc:
    en: "SIP proxy, SBC and load balancer with B2BUA modules, a fork of the SER line."
    ru: "SIP proxy/SBC/LB с B2BUA-модулями, форк SER-ветки."
- id: drachtio
  docker:
  - drachtio/drachtio-server
  nvd: drachtio
  name: drachtio-server
  category: SIP Proxy
  repo: drachtio/drachtio-server
  homepage: 'https://drachtio.org'
  desc:
