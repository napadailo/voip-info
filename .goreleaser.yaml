# Release: a tag vX.Y.Z builds voip-info for Linux and macOS and attaches
# the archives and checksums to the GitHub release.
version: 2

project_name: voip-info

builds:
  - id: voip-info
    main: ./cmd/voip-info
    binary: voip-info
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: voip-info
    ids: [voip-info]
    name_template: "voip-info_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/voip-info.md
      - docs/voip-info.ru.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: napadailo
    name: voip-info
